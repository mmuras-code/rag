[project]
name = "orchestrator"
version = "0.1.0"
description = "OpenAI-compatible backend for Open WebUI"
requires-python = ">=3.11"
dependencies = [
    "common",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "contracts",
    "grpcio>=1.84.0",
    "observability",
    "httpx>=0.28.1",
]

[tool.uv.sources]
common = { path = "../common", editable = true }
contracts = { path = "../proto", editable = true }
observability = { path = "../observability", editable = true }

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
