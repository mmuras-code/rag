[project]
name = "llm"
version = "0.1.0"
description = "Provider-agnostic model client (chat, streaming and embeddings via OpenRouter)"
requires-python = ">=3.11"
dependencies = [
    "common",
    "httpx>=0.27",
    "observability",
    "openinference-semantic-conventions>=0.1.40",
    "openrouter>=1.3.16",
]

[tool.uv.sources]
common = { path = "../common", editable = true }
observability = { path = "../observability", editable = true }

[dependency-groups]
dev = ["httpx>=0.27", "opentelemetry-sdk>=1.45.0", "pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
