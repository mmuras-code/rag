[project]
name = "integration-tests"
version = "0.1.0"
description = "Asks the running orchestrator a set of questions and checks the answers"
requires-python = ">=3.11"
dependencies = ["orchestrator"]

[dependency-groups]
dev = ["pytest>=8", "pytest-xdist>=3"]

[tool.uv]
package = false

[tool.uv.sources]
orchestrator = { path = "../orchestrator", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
