[project]
name = "agent"
version = "0.1.0"
description = "Answers a conversation, retrieving from the notes via search"
requires-python = ">=3.11"
dependencies = [
    "common",
    "contracts",
    "grpcio>=1.84.0",
    "langchain-core>=1.6.6",
    "langgraph>=1.2.12",
    "llm",
    "observability",
    "openinference-instrumentation-langchain>=0.1.77",
    "openinference-semantic-conventions>=0.1.40",
    "opentelemetry-api>=1.45.0",
]

[tool.uv.sources]
common = { path = "../common", editable = true }
llm = { path = "../llm", editable = true }
contracts = { path = "../proto", editable = true }
observability = { path = "../observability", editable = true }

[dependency-groups]
dev = [
    "opentelemetry-sdk>=1.45.0",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
