[project]
name = "common"
version = "0.1.0"
description = "Values and helpers shared by every service in rag/"
requires-python = ">=3.11"
dependencies = ["python-dotenv>=1.0"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/common"]

[tool.pytest.ini_options]
testpaths = ["tests"]
