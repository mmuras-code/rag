[project]
name = "search"
version = "0.1.0"
description = "Semantic search over Obsidian notes (pgvector)"
requires-python = ">=3.11"
dependencies = [
    "common",
    "contracts",
    "llm",
    "observability",
    "grpcio>=1.84.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "httpx>=0.27",  # sync.py catches its network errors from llm.embed
]

[tool.uv.sources]
common = { path = "../common", editable = true }
contracts = { path = "../proto", editable = true }
llm = { path = "../llm", editable = true }
observability = { path = "../observability", editable = true }

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/search"]

[tool.pytest.ini_options]
testpaths = ["tests"]
